title: "Portfolio"
description: "Senior Product & Design portfolio featuring Orchard.careers."
baseurl: "/portfolio" # the subpath of your site
url: "https://pbaunach.github.io" # your GitHub Pages base URL

theme: minima

author:
  name: "Peter Baunach"
  role: "Head of Product & Design"

collections:
  case_studies:
    output: true
    permalink: /case-studies/:name/

defaults:
  - scope:
      path: ""
      type: "case_studies"
    values:
      layout: case-study

# Google Apps Script web app URL (ends in /exec) that emails Peter on each new
# visitor. Setup steps are in tools/visit-ping/Code.gs. Empty turns the ping off.
visit_ping_url: "https://script.google.com/macros/s/AKfycbwrD2RC_0LcF6euWtqrDYh_MlDlblSkFwDiLOiAmKVqKELYT7QyYFiqHqZfja03NXfc9A/exec"

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed

exclude:
  - orchard-prototype
  # Raw source for /frederick-automations/ (originals + the internal Denver
  # research PDF). Processed copies live in assets/img/frederick-automations/.
  - frederick-marketing-automation
  # Session handoff notes for the Orchard portfolio review. Never publish.
  - _handoff
  # Source for the Apps Script that _includes/visit-ping.html talks to. Not a page.
  - tools
  # Raw Windows exes for the Sleeper's Tomb demo (any version). The page serves the
  # zipped copy; skipping the exe keeps about 114 MB out of every build.
  - sleepers-tomb/builds/*/windows/*.exe

