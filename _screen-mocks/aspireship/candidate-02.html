<!doctype html>
<!--
  Polished recreation of assets/img/aspireship-screens/Candidate-02.png (candidate: My Matches).
  Same content and structure as the original screenshot, restyled with Aspireship brand tokens.
  Render: sh _screen-mocks/aspireship/render.sh candidate-02 Candidate-02-polished 1330 766
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aspireship · My matches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="brand.js"></script>
<link rel="stylesheet" href="brand.css">
<style>body { width: 1330px; height: 766px; }</style>
</head>
<body class="font-sans text-ink bg-gray-50">
<div class="flex h-full">

  <!-- Sidebar -->
  <aside class="g-purple flex w-[240px] shrink-0 flex-col px-4 pt-6 pb-5 text-white">
    <div class="flex items-center gap-2.5 px-1">
      <svg viewBox="0 0 24 24" class="h-9 w-9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.5c-2.6 1.8-4 4.6-4 8.2 0 1.9.4 3.6 1 5h6c.6-1.4 1-3.1 1-5 0-3.6-1.4-6.4-4-8.2Z"/><circle cx="12" cy="9.3" r="1.7"/>
        <path d="M8.5 12.8c-1.5.8-2.5 2.2-2.5 3.9l3-.9M15.5 12.8c1.5.8 2.5 2.2 2.5 3.9l-3-.9"/><path d="M10.6 18.4v1.8M12 18.4v3.1M13.4 18.4v1.8"/>
      </svg>
      <span class="text-[21px] font-medium tracking-tight">Aspireship</span>
    </div>
    <div class="mt-6 flex items-center gap-2.5 rounded-2xl bg-white/10 p-2.5 pr-3 ring-1 ring-inset ring-white/15">
      <div class="g-pink grid h-9 w-9 place-items-center rounded-full text-[13px] font-semibold ring-2 ring-white/30">SS</div>
      <div class="flex-1 whitespace-nowrap text-[13px] font-medium">Sally Salesperson</div>
      <svg viewBox="0 0 24 24" class="ico h-4 w-4 text-white/70"><path d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
    </div>
    <nav class="mt-6 space-y-0.5 text-[13.5px]">
      <a class="flex items-center gap-3 rounded-xl px-3 py-2 text-white/75"><svg viewBox="0 0 24 24" class="ico h-[18px] w-[18px]"><path d="M12 2.5c-2.6 1.8-4 4.6-4 8.2 0 1.9.4 3.6 1 5h6c.6-1.4 1-3.1 1-5 0-3.6-1.4-6.4-4-8.2Z"/><circle cx="12" cy="9.3" r="1.6"/><path d="M8.5 12.8c-1.5.8-2.5 2.2-2.5 3.9l3-.9M15.5 12.8c1.5.8 2.5 2.2 2.5 3.9l-3-.9M12 18.6v2.6"/></svg>Aspireships</a>
      <a class="flex items-center gap-3 rounded-xl bg-white px-3 py-2 font-medium text-purple shadow-sm"><svg viewBox="0 0 24 24" class="ico h-[18px] w-[18px]"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2"/><path d="M5.8 16c.6-1.4 1.8-2.2 3.2-2.2s2.6.8 3.2 2.2M14.5 10h3.5M14.5 13.5h3.5"/></svg>My Matches</a>
      <a class="flex items-center gap-3 rounded-xl px-3 py-2 text-white/75"><svg viewBox="0 0 24 24" class="ico h-[18px] w-[18px]"><path d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25A2.25 2.25 0 0 1 18.75 21H5.25A2.25 2.25 0 0 1 3 18.75ZM3 9.75h18"/><circle cx="12" cy="15" r="1.6"/></svg>Live!</a>
      <a class="flex items-center gap-3 rounded-xl px-3 py-2 text-white/75"><svg viewBox="0 0 24 24" class="ico h-[18px] w-[18px]"><circle cx="12" cy="6.5" r="2.75"/><circle cx="6" cy="16.5" r="2.75"/><circle cx="18" cy="16.5" r="2.75"/></svg>Community</a>
      <a class="flex items-center gap-3 rounded-xl px-3 py-2 text-white/75"><svg viewBox="0 0 24 24" class="ico h-[18px] w-[18px]"><rect x="6" y="6" width="15" height="13" rx="2.25"/><path d="M3 15.5V5.25A2.25 2.25 0 0 1 5.25 3H16.5"/><path d="m12 10 4 2.5-4 2.5Z"/></svg>Video Library</a>
    </nav>
    <a class="mt-auto flex items-center gap-3 rounded-xl px-3 py-2 text-[13.5px] text-white/80"><svg viewBox="0 0 24 24" class="ico h-[18px] w-[18px]"><path d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"/></svg>Support</a>
  </aside>

  <!-- Main -->
  <main class="min-w-0 flex-1 px-7 pt-6">
    <h1 class="text-[26px] font-semibold leading-tight tracking-tight">My Matches</h1>
    <h2 class="mt-3 text-[12px] font-semibold uppercase tracking-[.08em] text-gray-600">Current matches</h2>
    <div id="current" class="mt-2.5 grid grid-cols-3 gap-5"></div>

    <h2 class="mt-6 text-[12px] font-semibold uppercase tracking-[.08em] text-gray-600">Match history</h2>
    <div id="history" class="mt-2.5 grid grid-cols-3 gap-5"></div>
  </main>
</div>

<script>
  const ICON = {
    globe: '<path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0c2.5 0 4.5-4 4.5-9S14.5 3 12 3m0 18c-2.5 0-4.5-4-4.5-9S9.5 3 12 3M3.5 9h17M3.5 15h17"/>',
    cash:  '<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',
    pin:   '<path d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/>',
    check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  };
  const svg = (p, cls) => `<svg viewBox="0 0 24 24" class="ico ${cls}">${p}</svg>`;
  const sparkles = `<svg viewBox="0 0 330 116" class="absolute inset-0 h-full w-full text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.5"><g opacity=".55"><path d="M28 24v12M22 30h12"/><circle cx="300" cy="28" r="5"/><circle cx="310" cy="48" r="2" fill="currentColor" stroke="none"/></g></svg>`;

  // Message Monkey logo mark: a monkey face in a chat bubble.
  const logo = `<svg viewBox="0 0 48 48" class="h-[44px] w-[44px]">
    <defs><linearGradient id="mm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FEC476"/><stop offset="1" stop-color="#FD7448"/></linearGradient></defs>
    <circle cx="11.5" cy="20" r="5" fill="#FD7448"/><circle cx="11.5" cy="20" r="2.4" fill="#FFE3C4"/>
    <circle cx="36.5" cy="20" r="5" fill="#FD7448"/><circle cx="36.5" cy="20" r="2.4" fill="#FFE3C4"/>
    <path d="M14 36.5 11.5 43l8.2-4.6Z" fill="#FD7448"/>
    <rect x="11" y="9" width="26" height="30" rx="13" fill="url(#mm)"/>
    <circle cx="20" cy="22" r="5" fill="#FFE3C4"/><circle cx="28" cy="22" r="5" fill="#FFE3C4"/>
    <ellipse cx="24" cy="29.5" rx="8.5" ry="6" fill="#FFE3C4"/>
    <circle cx="20.6" cy="22.4" r="1.6" fill="#001226"/><circle cx="27.4" cy="22.4" r="1.6" fill="#001226"/>
    <path d="M20.5 29.6c2 2 5 2 7 0" fill="none" stroke="#001226" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M17 12.5c2-2 5.5-2.5 7-1" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/>
  </svg>`;
  function header(grad, role, muted) {
    return `<div class="relative flex h-[116px] flex-col items-center justify-center ${muted ? 'bg-gray-200 text-gray-600' : grad + ' text-white'}">
      ${muted ? '' : sparkles}
      <div class="relative grid h-12 w-12 place-items-center rounded-full bg-white ${muted ? 'opacity-70 grayscale' : 'ring-[3px] ring-white/60 shadow-md'}">${logo}</div>
      <div class="relative mt-2 text-[16px] font-semibold leading-tight">Message Monkey</div>
      <div class="relative text-[12px] ${muted ? 'text-gray-600' : 'text-white/85'}">${role}</div>
    </div>`;
  }
  function facts(base, ote) {
    const row = (icon, label, value) => `<div class="flex items-start gap-3">
      <span class="mt-0.5 grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-purple/[.07] text-purple">${svg(icon, 'h-3.5 w-3.5')}</span>
      <div class="min-w-0"><div class="text-[10.5px] font-medium uppercase tracking-[.06em] text-gray-400">${label}</div><div class="text-[13px] leading-snug">${value}</div></div></div>`;
    return `<div class="space-y-2.5 px-4 pt-4">
      ${row(ICON.globe, 'Website', '<span class="text-purple">https://www.messagemonkey.com</span>')}
      ${row(ICON.cash, 'Compensation', `<span class="font-semibold">Base: ${base}</span><span class="ml-3 text-gray-600">OTE: ${ote}</span>`)}
      ${row(ICON.pin, 'Location', 'Remote')}
    </div>`;
  }
  function stepper(step) {
    // step: index of the active step (0..2); earlier steps are done
    let out = '<div class="flex items-center px-6">';
    for (let i = 0; i < 3; i++) {
      const done = i < step, active = i === step;
      const dot = active ? 'h-4 w-4 bg-white ring-[3px] ring-purple' : done ? 'h-2.5 w-2.5 bg-purple' : 'h-2.5 w-2.5 bg-gray-300';
      out += `<span class="shrink-0 rounded-full ${dot}"></span>`;
      if (i < 2) out += `<span class="h-[3px] flex-1 rounded-full ${i < step ? 'bg-purple' : 'bg-gray-150'}"></span>`;
    }
    return out + '</div>';
  }
  function card(m) {
    const choice = m.step === 0
      ? `<div class="grid grid-cols-2 gap-2.5">
           <span class="rounded-full bg-[#0DA818] py-2 text-center text-[13px] font-semibold text-white shadow-sm">Interested</span>
           <span class="rounded-full bg-white py-2 text-center text-[13px] font-medium text-gray-700 ring-1 ring-inset ring-gray-300">Not Interested</span>
         </div>`
      : `<div class="flex items-center justify-center gap-2 rounded-full bg-[#0DA818]/10 py-2 text-[13px] font-semibold text-[#0B8A14]">
           <span class="g-green grid h-5 w-5 place-items-center rounded-full text-white"><svg viewBox="0 0 24 24" class="h-3 w-3" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">${ICON.check}</svg></span>Interested
         </div>`;
    return `<article class="overflow-hidden rounded-2xl bg-white shadow-card ring-1 ring-gray-150">
      ${header(m.grad, m.role)}
      ${facts(m.base, m.ote)}
      <div class="px-4 pt-3.5"><span class="block rounded-full bg-ink py-2 text-center text-[13px] font-semibold text-white">View More</span></div>
      <div class="mx-4 mt-3.5 border-t border-gray-150 pt-3">
        <div class="mb-2 text-[11.5px] font-semibold text-gray-700">Are you interested in this role?</div>
        ${choice}
      </div>
      <div class="pb-3.5 pt-3.5">${stepper(m.step)}
        <div class="mt-2 flex items-center justify-center gap-1.5 text-[12px] ${m.step === 2 ? 'font-medium text-[#0B8A14]' : 'text-gray-600'}">${m.step === 2 ? `<span class="g-green grid h-4 w-4 place-items-center rounded-full text-white"><svg viewBox="0 0 24 24" class="h-2.5 w-2.5" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">${ICON.check}</svg></span>` : ''}${m.status}</div>
      </div>
    </article>`;
  }

  const current = [
    { grad: 'g-green',  role: 'Business Development Representative', base: '$80k', ote: '$150k+', step: 0, status: 'Waiting for your response.' },
    { grad: 'g-purple', role: 'Sales Development Representative',    base: '$65k', ote: '$130k+', step: 1, status: 'Waiting for the employer&rsquo;s response.' },
    { grad: 'g-pink',   role: 'Business Development Representative', base: '$80k', ote: '$150k+', step: 2, status: 'The employer is interested' },
  ];
  document.getElementById('current').innerHTML = current.map(card).join('');
  document.getElementById('history').innerHTML = [0, 1, 2].map(() =>
    `<article class="overflow-hidden rounded-2xl bg-white opacity-80 shadow-card ring-1 ring-gray-150">${header('', 'Business Development Representative', true)}<div class="h-20"></div></article>`).join('');
</script>
</body>
</html>
