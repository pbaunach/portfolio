<!doctype html>
<!--
  Polished recreation of assets/img/aspireship-screens/Employer-01.png (employer: match queue).
  Same content and structure as the original screenshot, restyled with Aspireship brand tokens.
  Headshots are cropped from the original screenshot.
  Render: sh _screen-mocks/aspireship/render.sh employer-01 Employer-01-polished 1361 1025
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aspireship · Matches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="brand.js"></script>
<script src="parts.js"></script>
<link rel="stylesheet" href="brand.css">
<style>body { width: 1361px; height: 1025px; }</style>
</head>
<body class="font-sans text-ink bg-gray-50">
<div class="flex h-full">
  <div id="sidebar" class="contents"></div>

  <main class="min-w-0 flex-1 px-7 pt-5">
    <!-- Title + filters -->
    <div class="flex items-center gap-4">
      <h1 class="mr-2 text-[26px] font-semibold tracking-tight">Matches</h1>
      <div class="flex h-11 w-[150px] items-center gap-2 rounded-xl bg-white px-3 shadow-card ring-1 ring-gray-150">
        <div class="flex-1 leading-tight"><div class="text-[10px] font-medium uppercase tracking-[.06em] text-gray-400">Job Status</div><div class="flex items-center gap-1.5 text-[13px] font-medium"><span class="h-2 w-2 rounded-full bg-[#0DA818]"></span>Open</div></div>
        <svg viewBox="0 0 24 24" class="ico h-4 w-4 text-gray-400"><path d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
      </div>
      <div class="flex h-11 w-[250px] items-center gap-2 rounded-xl bg-white px-3 shadow-card ring-1 ring-gray-150">
        <div class="flex-1 leading-tight"><div class="text-[10px] font-medium uppercase tracking-[.06em] text-gray-400">Role</div><div class="text-[13px] font-medium">All</div></div>
        <svg viewBox="0 0 24 24" class="ico h-4 w-4 text-gray-400"><path d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
      </div>
    </div>

    <!-- Tabs -->
    <div class="mt-4 inline-flex gap-1 rounded-xl bg-white p-1 shadow-card ring-1 ring-gray-150 text-[13px]">
      <span class="rounded-lg bg-purple px-4 py-1.5 font-medium text-white">New Matches</span>
      <span class="rounded-lg px-4 py-1.5 text-gray-600">Active Matches</span>
      <span class="rounded-lg px-4 py-1.5 text-gray-600">Archived Matches</span>
    </div>

    <h2 class="mt-5 flex items-center gap-2 text-[12px] font-semibold uppercase tracking-[.08em] text-gray-600">
      <svg viewBox="0 0 24 24" class="ico h-4 w-4 text-purple"><path d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.767 6.767 0 0 1-3.044 0"/></svg>
      Staff picks
    </h2>
    <div id="picks" class="mt-2.5 grid grid-cols-3 gap-5"></div>

    <div class="my-4 h-px bg-gray-200"></div>
    <div id="rest" class="grid grid-cols-3 gap-5"></div>
  </main>
</div>

<script>
  document.getElementById('sidebar').innerHTML = ASP.employerSidebar('matches', 'Recruiting');

  const sparkles = `<svg viewBox="0 0 340 124" class="absolute inset-0 h-full w-full text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2.5"><g opacity=".55"><path d="M256 20v10M251 25h10M46 60v10M41 65h10"/><circle cx="228" cy="34" r="4"/><circle cx="96" cy="30" r="2" fill="currentColor" stroke="none"/><circle cx="300" cy="70" r="4"/></g></svg>`;
  // Staff pick tag: white pill so it reads on every header gradient.
  const ribbon = `<span class="absolute left-3 top-3 inline-flex items-center gap-1.5 rounded-full bg-white py-1 pl-1 pr-2.5 text-[11px] font-semibold text-ink shadow-md">
    <span class="g-orange grid h-[18px] w-[18px] place-items-center rounded-full text-white"><svg viewBox="0 0 24 24" class="h-3 w-3" fill="currentColor"><path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.7l-5.4 2.9 1.1-6.1-4.5-4.3 6.1-.8Z"/></svg></span>Staff Pick</span>`;

  const checkCircle = '<circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.6-4.8"/>';
  const xCircle = '<circle cx="12" cy="12" r="9"/><path d="m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6"/>';
  const btn = 'flex items-center justify-center gap-1.5 rounded-lg py-1.5';
  // Interest buttons: unanswered by default; a chosen answer fills in and the other option dims.
  function choice(interested) {
    if (interested) return `<span class="${btn} bg-[#0DA818] font-semibold text-white shadow-sm"><svg viewBox="0 0 24 24" class="ico h-4 w-4" style="stroke-width:2">${checkCircle}</svg>Interested</span>
      <span class="${btn} bg-white font-medium text-gray-400 ring-1 ring-inset ring-gray-200"><svg viewBox="0 0 24 24" class="ico h-4 w-4">${xCircle}</svg>Not Interested</span>`;
    return `<span class="${btn} bg-white font-medium text-[#0B8A14] ring-1 ring-inset ring-[#0DA818]/45"><svg viewBox="0 0 24 24" class="ico h-4 w-4">${checkCircle}</svg>Interested</span>
      <span class="${btn} bg-white font-medium text-[#D92D20] ring-1 ring-inset ring-[#D92D20]/35"><svg viewBox="0 0 24 24" class="ico h-4 w-4">${xCircle}</svg>Not Interested</span>`;
  }
  function card(c) {
    const achievements = c.badge
      ? `<div class="mt-1.5 flex items-center gap-2"><img src="img/badge-sales-foundations-lg.png" alt="" class="h-[36px] w-[29px]"></div>`
      : `<div class="mt-1 text-[12.5px] italic text-gray-400">None so far.</div>`;
    return `<article class="overflow-hidden rounded-2xl bg-white shadow-card ring-1 ring-gray-150">
      <div class="${c.grad} relative flex h-[124px] flex-col pt-1 items-center justify-center text-white">
        ${sparkles}${c.pick ? ribbon : ''}
        <div class="relative h-[52px] w-[52px] overflow-hidden rounded-full bg-white ring-[3px] ring-white shadow-md"><img src="img/emp-${c.img}.png" alt="" class="h-full w-full scale-[1.12] object-cover"></div>
        <div class="relative mt-1.5 text-[15px] font-semibold leading-tight">${c.name}</div>
        ${c.grad_badge ? `<span class="relative mt-1 rounded-full bg-white px-2.5 py-px text-[10.5px] font-semibold text-purple shadow-sm">Graduate</span>` : ''}
      </div>
      <div class="px-4 pb-4 pt-3.5">
        <dl class="grid grid-cols-[1fr_auto] gap-x-4 text-[12.5px]">
          <div><dt class="text-[10px] font-medium uppercase tracking-[.06em] text-gray-400">Role</dt><dd class="leading-snug">${c.role}</dd></div>
          <div><dt class="text-[10px] font-medium uppercase tracking-[.06em] text-gray-400">Location</dt><dd>Remote</dd></div>
        </dl>
        <div class="mt-3 min-h-[66px]"><div class="text-[10px] font-medium uppercase tracking-[.06em] text-gray-400">Aspireship Achievements</div>${achievements}</div>
        <span class="mt-3 block rounded-full bg-ink py-2 text-center text-[12.5px] font-semibold text-white">View More</span>
        <div class="mt-3 border-t border-gray-150 pt-2.5">
          <div class="mb-2 text-[11.5px] font-semibold text-gray-700">Are you interested in this candidate?</div>
          <div class="grid grid-cols-2 gap-2 text-[12.5px]">${choice(c.interested)}</div>
        </div>
      </div>
    </article>`;
  }

  const picks = [
    { name: 'Derek Decady', img: 'derek', grad: 'g-orange', role: 'Sales Development Representative', pick: true },
    { name: 'Renny Noel', img: 'renny', grad: 'g-purple', role: 'Sales Development Representative', pick: true, grad_badge: true, badge: true, interested: true },
  ];
  const rest = [
    { name: 'Johnathan Wellington', img: 'johnathan', grad: 'g-pink', role: 'Account Executive', grad_badge: true, badge: true },
    { name: 'Victor Ruggiano', img: 'victor-r', grad: 'g-green', role: 'Sales Development Representative', grad_badge: true, badge: true },
    { name: 'Victor King', img: 'victor-k', grad: 'g-violet', role: 'Account Executive', grad_badge: true, badge: true },
  ];
  document.getElementById('picks').innerHTML = picks.map(card).join('');
  document.getElementById('rest').innerHTML = rest.map(card).join('');
</script>
</body>
</html>
