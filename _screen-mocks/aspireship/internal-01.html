<!doctype html>
<!--
  Polished recreation of assets/img/aspireship-screens/Internal-01.png (internal admin dashboard).
  Same content, numbers and structure as the original screenshot (point-in-time dashboard readings),
  restyled with Aspireship brand tokens. Donut arcs follow the original's proportions, drawn end to end.
  Render: sh _screen-mocks/aspireship/render.sh internal-01 Internal-01-polished 1366 768
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aspireship · Admin dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="brand.js"></script>
<script src="parts.js"></script>
<link rel="stylesheet" href="brand.css">
<style>body { width: 1366px; height: 768px; }</style>
</head>
<body class="font-sans text-ink bg-gray-50">
<div class="flex h-full">
  <div id="sidebar" class="contents"></div>

  <main class="min-w-0 flex-1 px-6 pt-5">
    <!-- Stat cards -->
    <div class="grid grid-cols-3 gap-4">
      <div class="flex items-center gap-4 rounded-2xl bg-white p-5 shadow-card ring-1 ring-gray-150">
        <span class="g-purple grid h-11 w-11 shrink-0 place-items-center rounded-xl text-white"><svg viewBox="0 0 24 24" class="ico h-6 w-6"><path d="M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m8.9-4.414c.376.023.75.05 1.124.08 1.131.094 1.976 1.057 1.976 2.192V16.5A2.25 2.25 0 0 1 18 18.75h-2.25m-7.5-10.5H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V18.75m-7.5-10.5h6.375c.621 0 1.125.504 1.125 1.125v9.375m-8.25-3 1.5 1.5 3-3.75"/></svg></span>
        <div><div class="text-[30px] font-semibold leading-none">8</div><div class="mt-1.5 whitespace-nowrap text-[12.5px] text-gray-600">Assessments Ready for Review</div></div>
      </div>
      <div class="flex items-center gap-4 rounded-2xl bg-white p-5 shadow-card ring-1 ring-gray-150">
        <span class="g-blue grid h-11 w-11 shrink-0 place-items-center rounded-xl text-white"><svg viewBox="0 0 24 24" class="ico h-6 w-6"><path d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/></svg></span>
        <div><div class="text-[30px] font-semibold leading-none">117</div><div class="mt-1.5 whitespace-nowrap text-[12.5px] text-gray-600">Candidates Ready to Hire</div></div>
      </div>
      <div class="flex items-center gap-4 rounded-2xl bg-white p-5 shadow-card ring-1 ring-gray-150">
        <span class="g-pink grid h-11 w-11 shrink-0 place-items-center rounded-xl text-white"><svg viewBox="0 0 24 24" class="ico h-6 w-6"><path d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg></span>
        <div><div class="text-[30px] font-semibold leading-none">23</div><div class="mt-1.5 whitespace-nowrap text-[12.5px] text-gray-600">Jobs Ready to Fill</div></div>
      </div>
    </div>

    <div id="sections" class="mt-5 space-y-5"></div>
  </main>
</div>

<script>
  document.getElementById('sidebar').innerHTML = ASP.adminSidebars('dashboard');

  // Donut: arcs as [start%, end%, color]; rest is track.
  function donut(arcs, label, value) {
    const r = 84, C = 2 * Math.PI * r;
    const seg = ([a, b, c]) => `<circle cx="100" cy="100" r="${r}" fill="none" stroke="${c}" stroke-width="16" stroke-linecap="butt"
        stroke-dasharray="${(b - a) / 100 * C} ${C}" stroke-dashoffset="${-a / 100 * C}" transform="rotate(-90 100 100)"/>`;
    return `<div class="relative h-[210px] w-[210px]">
      <svg viewBox="0 0 200 200" class="h-full w-full"><circle cx="100" cy="100" r="${r}" fill="none" stroke="#E2E5E8" stroke-width="16"/>${arcs.map(seg).join('')}</svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center"><div class="max-w-[120px] text-center text-[11px] leading-tight text-gray-600">${label}</div><div class="mt-0.5 text-[26px] font-semibold leading-tight">${value}</div></div>
    </div>`;
  }
  function section(title, total, rows, arcs, donutLabel, donutValue) {
    return `<div class="flex gap-4">
      <div class="flex-1 rounded-2xl bg-white px-5 pb-2 pt-4 shadow-card ring-1 ring-gray-150">
        <div class="flex items-baseline justify-between">
          <div><div class="text-[12px] font-semibold uppercase tracking-[.08em] text-gray-600">${title}</div><div class="text-[28px] font-semibold leading-tight">${total}</div></div>
        </div>
        <table class="mt-1 w-full text-[13px]"><tbody>
          ${rows.map(([name, pct, n]) => `<tr class="border-t border-gray-150">
            <td class="py-[13px]">${name}</td>
            <td class="w-[180px] py-[13px]"><div class="flex items-center gap-2.5"><div class="h-1.5 flex-1 overflow-hidden rounded-full bg-gray-150"><div class="h-full rounded-full bg-purple" style="width:${pct}"></div></div><span class="w-9 text-right text-[12px] text-gray-600">${pct}</span></div></td>
            <td class="w-[70px] py-[13px] text-right font-semibold tabular-nums">${n}</td></tr>`).join('')}
        </tbody></table>
      </div>
      <div class="grid w-[260px] shrink-0 place-items-center rounded-2xl bg-white shadow-card ring-1 ring-gray-150">${donut(arcs, donutLabel, donutValue)}</div>
    </div>`;
  }
  document.getElementById('sections').innerHTML =
    section('Total Candidate Count', '4,223', [
      ['Candidates ready to hire', '4%', '117'],
      ['Candidates inactive for 30+ days', '83%', '3,000'],
      ['Candidates in progress', '11%', '1,000'],
      ['Candidates placed total', '2%', '20'],
    ], [[0, 16.5, '#4810A4'], [16.5, 26.5, '#35BAFD'], [26.5, 27.5, '#001226']], 'Total Candidate Count', '4,137') +
    section('Total Job Count', '120', [
      ['Jobs ready to fill', '4%', '23'],
      ['Jobs filled', '83%', '97'],
      ['Jobs filled not by us', '13%', '32'],
    ], [[0, 15.5, '#4810A4'], [15.5, 26.5, '#35BAFD']], 'Total Job Count', '152');
</script>
</body>
</html>
