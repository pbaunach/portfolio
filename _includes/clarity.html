<script>
  // Named click events. Any element with a data-clarity-event attribute reports that
  // attribute's value to Clarity as an event when clicked, so "which download did people pick" is a filterable
  // count rather than something to dig out of heatmaps. The guard matches the one used
  // on /aspireship-problem/. Clarity queues calls made before its tag has loaded.
  (function () {
    function track(name) {
      if (typeof window.clarity === "function") window.clarity("event", name);
    }
    document.addEventListener("click", function (e) {
      var el = e.target && e.target.closest ? e.target.closest("[data-clarity-event]") : null;
      if (el) track(el.getAttribute("data-clarity-event"));
    });
    // Tag every session with the build on offer, so feedback can be split by version.
    if (typeof window.clarity === "function") {
      window.clarity("set", "sleepers_tomb_build", "{{ site.data.sleepers_tomb.version }}");
    }
  })();
</script>
