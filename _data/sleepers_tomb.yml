# Sleeper's Tomb demo: the one place to bump when a new build lands.
#
# /sleepers-tomb/play/ reads this to find the web build, and /sleepers-tomb/ redirects
# there. A new build is: drop the Godot web export in
# sleepers-tomb/builds/<version>/web/ (index.html plus the rest), then change the number below.
#
# Only the web version is published. The Windows and Mac downloads were removed to keep
# the Pages site small, so don't add desktop zips back here.
version: "0.3.2"
