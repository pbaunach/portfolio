<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% if page.robots %}
    <meta name="robots" content="{{ page.robots }}">
    {% endif %}
    {% if page.x_robots_tag %}
    <meta http-equiv="X-Robots-Tag" content="{{ page.x_robots_tag }}">
    {% endif %}
    <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Bitter:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "vfddak4mdt");
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="site-logo" href="{{ '/' | relative_url }}">
          <div class="site-logo-name">
            <span class="site-logo-name__primary">Peter Baunach<span class="site-logo-name__dot">.</span></span>
            <span class="site-logo-name__secondary">Founding Product Designer &bull; AI Products &amp; 0-to-1</span>
          </div>
        </a>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Home</a>
        </nav>
      </div>
    </header>

    <main class="site-main container{% if page.url == '/' or page.url == '/index.html' %} site-main--home{% endif %}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}. All rights reserved.</p>
      </div>
    </footer>
    <script>
      (function() {
        var current = window.location.pathname.replace(/\/+$/, '');
        var home = '{{ "/" | relative_url }}'.replace(/\/+$/, '');
        if (current === home) {
          var homeLink = document.querySelector('.site-nav a[href="{{ "/" | relative_url }}"]');
          if (homeLink) {
            homeLink.classList.add('site-nav__link--active');
          }
        }
      })();
    </script>
    <script src="{{ '/assets/js/home-hero-parallax.js' | relative_url }}" defer></script>
  </body>
</html>
